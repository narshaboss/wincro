name: Regression Check

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "mcp==1.25.0"
          if (-not (Test-Path -LiteralPath 'C:\Projects\wincro')) {
            New-Item -ItemType Directory -Force -Path 'C:\Projects' | Out-Null
            New-Item -ItemType Junction -Path 'C:\Projects\wincro' -Target $env:GITHUB_WORKSPACE | Out-Null
          }
      - name: Notification delivery simulations (no network)
        run: python -m pytest -q tests/test_discord_notifier.py tests/test_discord_delivery_regression.py
      - name: Full regression including engine isolation
        run: python -m pytest -q
