name: Regression Check

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recording-legacy-ui:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install operator-compatible UI dependencies
        run: |
          python -m pip install -r requirements.txt "customtkinter==5.2.2" "mcp==1.25.0" pytest-timeout
          python -c "import sys, customtkinter; print(sys.version, customtkinter.__version__); assert customtkinter.__version__ == '5.2.2'"
      - name: GPT UI on operator-compatible Windows
        env:
          WINCRO_GPT_PLAY_UI_QA: '1'
        run: python -m pytest -q tests/test_gpt_play_native.py -k "textbox_state or recorder_survives or panel_on_off" --junitxml=artifacts/gpt_play/legacy-ui.xml
      - name: Recording workspace on operator-compatible Windows
        if: ${{ !cancelled() }}
        env:
          WINCRO_AI_EDITOR_UI_QA: '1'
        run: python -m pytest -vv tests/test_ai_draft_bridge_native.py -k "recording_workspace_layout" -o faulthandler_timeout=30 --timeout=60 --timeout-method=thread --junitxml=artifacts/ai_draft/legacy-workspace.xml
      - name: Upload legacy UI verification
        if: ${{ always() && hashFiles('artifacts/gpt_play/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: recording-legacy-ui
          path: |
            artifacts/gpt_play/
            artifacts/ai_draft/
          retention-days: 14
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "mcp==1.25.0"
          if (-not (Test-Path -LiteralPath 'C:\Projects\wincro')) {
            New-Item -ItemType Directory -Force -Path 'C:\Projects' | Out-Null
            New-Item -ItemType Junction -Path 'C:\Projects\wincro' -Target $env:GITHUB_WORKSPACE | Out-Null
          }
      - name: Notification delivery simulations (no network)
        run: python -m pytest -q tests/test_discord_notifier.py tests/test_discord_delivery_regression.py
      - name: AI draft save, media, permissions and contract simulations (no input)
        run: python -m pytest -q tests/test_ai_draft_bridge.py tests/test_ai_draft_guidance.py tests/test_recording_jobs.py tests/test_recording_plan_registration.py tests/test_recording_auto_registration.py tests/test_recording_followup.py tests/test_recording_autonomous.py tests/test_recording_analysis_performance.py tests/test_recording_connection.py tests/test_analyzer_playlist_only.py tests/test_analyzer_playlist_perf_regression.py tests/test_ui_virtualization_regression.py tests/test_ios_design_theme_regression.py tests/test_ui_text_overflow_regression.py tests/test_video_thumbnail.py tests/test_action_coordinate_labels.py tests/test_analysis_progress.py --junitxml=artifacts/ai_draft/core.xml
      - name: Measured recording timing and device-isolated typing simulations
        run: python -m pytest -q tests/test_recording_timing.py --junitxml=artifacts/ai_draft/timing.xml
      - name: GPT play isolation, input admission and candidate simulations
        if: ${{ !cancelled() }}
        run: python -m pytest -q tests/test_gpt_play.py tests/test_gpt_play_diagnostics.py tests/test_gpt_play_device_regression.py --junitxml=artifacts/gpt_play/simulations.xml
      - name: GPT play UI and authenticated pipe on isolated Windows
        if: ${{ !cancelled() }}
        env:
          WINCRO_GPT_PLAY_UI_QA: '1'
        run: python -m pytest -q tests/test_gpt_play_native.py --junitxml=artifacts/gpt_play/native.xml
      - name: Upload GPT play verification
        if: ${{ always() && hashFiles('artifacts/gpt_play/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gpt-play-qa
          path: artifacts/gpt_play/
          retention-days: 14
      - name: AI draft local-pipe and layout verification on isolated Windows
        if: ${{ !cancelled() }}
        env:
          WINCRO_AI_EDITOR_UI_QA: '1'
        run: python -m pytest -q tests/test_ai_draft_bridge_native.py -o junit_logging=all --junitxml=artifacts/ai_draft/results.xml
      - name: Upload GPT draft layout and native test evidence
        if: ${{ always() && hashFiles('artifacts/ai_draft/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-draft-ui
          path: artifacts/ai_draft/
          retention-days: 14
      - name: Prepare pinned Codex for offline transport QA
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'wincro-codex-qa'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $archive = Join-Path $folder 'codex.zip'
          Invoke-WebRequest 'https://github.com/openai/codex/releases/download/rust-v0.166.0/codex-x86_64-pc-windows-msvc.exe.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bf67d9662ed539f305849b74ad6420cc7b23aa2be07753710ca3db9134a0246d') { throw 'Codex archive integrity mismatch' }
          $env:LOCALAPPDATA = Join-Path $folder 'appdata'
          & ./tools/setup_recording_codex.ps1 -Archive $archive
          $executable = Join-Path $env:LOCALAPPDATA 'WinCro/gpt_runtime/0.166.0/codex-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path -LiteralPath $executable)) { throw 'Codex executable not found' }
          "WINCRO_TEST_CODEX_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Actual Codex offline model and packaged MCP transport checks
        if: ${{ !cancelled() }}
        env:
          WINCRO_RECORDING_CODEX_QA: '1'
        run: python -m pytest -q tests/test_recording_codex_native.py --junitxml=artifacts/recording_analysis/results.xml
      - name: Upload recording execution boundary evidence
        if: ${{ always() && hashFiles('artifacts/recording_analysis/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: recording-analysis-execution
          path: artifacts/recording_analysis/
          retention-days: 14
      - name: Dedicated video real-clip simulations and recognition isolation
        run: python -m pytest -q tests/test_dedicated_video_sampling.py tests/test_monitoring_condition_video_regression.py tests/test_optimization_resource_regression.py
      - name: Save integrity, stop handoff and notification identity simulations
        if: ${{ hashFiles('tests/test_integrity_lifecycle_20261030.py') != '' }}
        run: python -m pytest -q tests/test_review_20260915_risks.py tests/test_integrity_lifecycle_20261030.py tests/test_execution_input_boundary_regression.py tests/test_input_controller_hotkey_regression.py tests/test_input_cleanup_mouse_regression.py tests/test_rule_identity_regression.py tests/test_main_window_repeat_regression.py
      - name: Window-control contracts and protected engine isolation
        if: ${{ hashFiles('tests/test_window_control.py') != '' }}
        run: python -m pytest -q tests/test_window_control.py tests/test_window_control_multi.py tests/test_window_control_persistence.py tests/test_window_control_match_mode.py tests/test_window_control_runtime.py tests/test_window_control_editor.py tests/test_runtime_action_options.py tests/test_special_mode_engine_isolation.py
      - name: Window-control layout checks on isolated Windows desktop
        if: ${{ !cancelled() && hashFiles('tests/test_window_control_ui_layout.py') != '' }}
        env:
          WINCRO_WINDOW_CONTROL_UI_QA: '1'
          WINCRO_WINDOW_CONTROL_UI_QA_ARTIFACTS: artifacts/window_control
        run: python -m pytest -q tests/test_window_control_ui_layout.py
      - name: Input cleanup native context-menu regression (owned window only)
        if: ${{ !cancelled() && hashFiles('tests/test_input_cleanup_mouse_native.py') != '' }}
        env:
          WINCRO_INPUT_RELEASE_NATIVE_QA: '1'
        run: python -m pytest -q tests/test_input_cleanup_mouse_native.py
      - name: Native window-control checks against isolated test windows
        if: ${{ !cancelled() && hashFiles('tests/test_window_control_native.py') != '' }}
        env:
          WINCRO_WINDOW_CONTROL_UI_QA: '1'
        run: python -m pytest -q tests/test_window_control_native.py
      - name: Full regression including engine isolation
        if: ${{ !cancelled() }}
        run: python -m pytest -q --durations=15
      - name: Upload window-control UI verification
        if: ${{ always() && hashFiles('artifacts/window_control/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: window-control-ui
          path: artifacts/window_control/
          retention-days: 14
