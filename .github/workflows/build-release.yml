# WinCro ?먮룞 鍮뚮뱶 諛?由대━利?
# ?쒓렇 ?몄떆?섎㈃ ?먮룞?쇰줈 exe 鍮뚮뱶 ??Release ?앹꽦
#
# ?ъ슜踰?
#   git tag v1.0.1
#   git push origin v1.0.1
#
# ?먮뒗 ?섎룞?쇰줈 Actions ??뿉???ㅽ뻾 媛??

name: Build and Release

on:
  push:
    tags:
      - 'v*'  # v濡??쒖옉?섎뒗 ?쒓렇 (v1.0.0, v1.2.3 ??
  workflow_dispatch:  # ?섎룞 ?ㅽ뻾 媛??
    inputs:
      version:
        description: '踰꾩쟾 (?? 1.0.1)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          # ?쒓렇?먯꽌 v ?쒓굅
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Update version in code
      shell: python
      run: |
        import re
        version = "${{ steps.get_version.outputs.VERSION }}"

        # config.py??APP_VERSION ?낅뜲?댄듃
        config_path = "src/utils/config.py"
        with open(config_path, 'r', encoding='utf-8') as f:
            content = f.read()

        content = re.sub(
            r'APP_VERSION = "[^"]*"',
            f'APP_VERSION = "{version}"',
            content
        )

        with open(config_path, 'w', encoding='utf-8') as f:
            f.write(content)

        print(f"Updated APP_VERSION to {version}")

    - name: Build with PyInstaller (spec file)
      run: |
        pyinstaller WinCro.spec --clean --noconfirm
      shell: pwsh

    - name: Add legacy executable alias
      run: |
        Copy-Item "dist\?묒뾽?꾩슦誘??묒뾽?꾩슦誘?exe" "dist\?묒뾽?꾩슦誘?dwm.exe" -Force
      shell: pwsh

    - name: Create ZIP package
      run: |
        cd dist
        7z a -tzip "?묒뾽?꾩슦誘?v${{ steps.get_version.outputs.VERSION }}.zip" ?묒뾽?꾩슦誘?*
      shell: pwsh

    - name: Create or Update Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}"
        $tag = "v$version"
        $zipPath = "dist/?묒뾽?꾩슦誘?v$version.zip"
        $notesPath = "$env:RUNNER_TEMP/release_notes.txt"

        @"
        ## ?묒뾽?꾩슦誘?v$version

        ### ?ㅼ슫濡쒕뱶
        - **?묒뾽?꾩슦誘?v$version.zip** - ?꾩껜 ?⑦궎吏

        ### ?ㅼ튂 諛⑸쾿
        1. zip ?뚯씪 ?ㅼ슫濡쒕뱶
        2. ?먰븯???대뜑???뺤텞 ?댁젣
        3. ?묒뾽?꾩슦誘?exe ?ㅽ뻾!

        ### ?낅뜲?댄듃 諛⑸쾿
        - ?꾨줈洹몃옩 ???ㅼ젙 > ?낅뜲?댄듃 ?ㅼ젙?먯꽌 "踰꾩쟾 ?뺤씤" ??"?낅뜲?댄듃 ?ㅼ슫濡쒕뱶"

        ### 蹂寃??ы빆
        - ?먮룞 ?앹꽦??由대━利덉엯?덈떎
        "@ | Set-Content -Path $notesPath -Encoding UTF8

        gh release view $tag *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create $tag $zipPath --target $env:GITHUB_SHA --title "?묒뾽?꾩슦誘?v$version" --notes-file $notesPath
        } else {
          gh release edit $tag --title "?묒뾽?꾩슦誘?v$version" --notes-file $notesPath
          gh release upload $tag $zipPath --clobber
        }

