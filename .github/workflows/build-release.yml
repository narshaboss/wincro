name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version files
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          version = "${{ steps.meta.outputs.version }}"

          config_path = Path("src/utils/config.py")
          config_text = config_path.read_text(encoding="utf-8")
          config_text = re.sub(r'APP_VERSION = "[^"]*"', f'APP_VERSION = "{version}"', config_text)
          config_path.write_text(config_text, encoding="utf-8")

          init_path = Path("src/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_text = re.sub(r'__version__ = "[^"]*"', f'__version__ = "{version}"', init_text)
          init_path.write_text(init_text, encoding="utf-8")

          cache_path = Path("data/update_cache.json")
          if cache_path.exists():
            data = json.loads(cache_path.read_text(encoding="utf-8"))
            data["current_version"] = version
            result = data.get("result") or {}
            if isinstance(result, dict):
              result["version"] = version
              data["result"] = result
            cache_path.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller WinCro.spec --clean --noconfirm

      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $appDir = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $appDir) {
            throw "No application directory found under dist"
          }

          $mainExe = Get-ChildItem $appDir.FullName -Filter *.exe | Where-Object { $_.Name -ne "dwm.exe" } | Select-Object -First 1
          if (-not $mainExe) {
            throw "No main executable found in $($appDir.FullName)"
          }

          Copy-Item $mainExe.FullName (Join-Path $appDir.FullName "dwm.exe") -Force

          $zipPath = Join-Path $env:RUNNER_TEMP "_v$version.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $appDir.FullName "*") -DestinationPath $zipPath -CompressionLevel Optimal

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "v$version"
          $zipPath = "${{ steps.package.outputs.zip_path }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "release_notes.txt"

          @"
          작업도우미 v$version

          Automated release package.
          "@ | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zipPath --target ${{ github.sha }} --title "작업도우미 v$version" --notes-file $notesPath
          }
          else {
            gh release edit $tag --title "작업도우미 v$version" --notes-file $notesPath
            gh release upload $tag $zipPath --clobber
          }
