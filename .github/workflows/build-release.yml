name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version from repository
        id: meta
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          config_text = Path("src/utils/config.py").read_text(encoding="utf-8")
          init_text = Path("src/__init__.py").read_text(encoding="utf-8")

          config_match = re.search(r'APP_VERSION = "([^"]+)"', config_text)
          init_match = re.search(r'__version__ = "([^"]+)"', init_text)
          if not config_match or not init_match:
            raise SystemExit("Could not read version from repository files")

          config_version = config_match.group(1)
          init_version = init_match.group(1)
          if config_version != init_version:
            raise SystemExit(
                f"Version mismatch: config={config_version} init={init_version}"
            )

          cache_path = Path("data/update_cache.json")
          if cache_path.exists():
            cache_data = json.loads(cache_path.read_text(encoding="utf-8-sig"))
            cache_version = cache_data.get("current_version")
            if cache_version and cache_version != config_version:
                raise SystemExit(
                    f"Version mismatch: config={config_version} cache={cache_version}"
                )

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as handle:
            handle.write(f"version={config_version}\n")
            handle.write(f"tag=v{config_version}\n")

      - name: Sync release tag
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          git tag -f "$tag" "${{ github.sha }}"
          git push origin "refs/tags/$tag" --force

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller WinCro.spec --clean --noconfirm

      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $appDir = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $appDir) {
            throw "No application directory found under dist"
          }

          $mainExe = Get-ChildItem $appDir.FullName -Filter *.exe | Where-Object { $_.Name -ne "dwm.exe" } | Select-Object -First 1
          if (-not $mainExe) {
            throw "No main executable found in $($appDir.FullName)"
          }

          Copy-Item $mainExe.FullName (Join-Path $appDir.FullName "dwm.exe") -Force

          $packagedCache = Join-Path $appDir.FullName "_internal\data\update_cache.json"
          if (Test-Path $packagedCache) {
            Remove-Item $packagedCache -Force
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "_v$version.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $appDir.FullName "*") -DestinationPath $zipPath -CompressionLevel Optimal

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipPath = "${{ steps.package.outputs.zip_path }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "release_notes.txt"
          $title = "작업도우미 v$version"

          @"
          작업도우미 v$version

          Automated release package.
          "@ | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zipPath --target ${{ github.sha }} --title $title --notes-file $notesPath
          }
          else {
            gh release edit $tag --target ${{ github.sha }} --title $title --notes-file $notesPath
            gh release upload $tag $zipPath --clobber
          }
