name: Build and Release
run-name: ${{ github.ref_type == 'tag' && format('{0} Build and Release', github.ref_name) || github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version from repository
        id: meta
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          config_text = Path("src/utils/config.py").read_text(encoding="utf-8")
          init_text = Path("src/__init__.py").read_text(encoding="utf-8")
          version_info_text = Path("version_info.txt").read_text(encoding="utf-8")

          config_match = re.search(r'APP_VERSION = "([^"]+)"', config_text)
          init_match = re.search(r'__version__ = "([^"]+)"', init_text)
          if not config_match or not init_match:
            raise SystemExit("Could not read version from repository files")

          config_version = config_match.group(1)
          init_version = init_match.group(1)
          if config_version != init_version:
            raise SystemExit(
                f"Version mismatch: config={config_version} init={init_version}"
            )

          version_parts = tuple(int(part) for part in config_version.split("."))
          expected_tuple = version_parts + (0,) * (4 - len(version_parts))
          expected_string = ".".join(str(part) for part in expected_tuple)

          for key in ("filevers", "prodvers"):
            match = re.search(rf"{key}=\(([^)]*)\)", version_info_text)
            if not match:
              raise SystemExit(f"Could not read {key} from version_info.txt")
            actual = tuple(int(part.strip()) for part in match.group(1).split(","))
            if actual != expected_tuple:
              raise SystemExit(
                  f"Version mismatch: {key}={actual} expected={expected_tuple}"
              )

          for key in ("FileVersion", "ProductVersion"):
            match = re.search(
                rf"StringStruct\(u'{key}', u'([^']+)'\)", version_info_text
            )
            if not match or match.group(1) != expected_string:
              actual = match.group(1) if match else "missing"
              raise SystemExit(
                  f"Version mismatch: {key}={actual} expected={expected_string}"
              )

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as handle:
            handle.write(f"version={config_version}\n")
            handle.write(f"tag=v{config_version}\n")

      - name: Sync release tag
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          git tag -f "$tag" "${{ github.sha }}"
          git push origin "refs/tags/$tag" --force

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller WinCro.spec --clean --noconfirm

      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $appDir = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $appDir) {
            throw "No application directory found under dist"
          }

          $mainExe = Get-ChildItem $appDir.FullName -Filter *.exe | Select-Object -First 1
          if (-not $mainExe) {
            throw "No main executable found in $($appDir.FullName)"
          }

          $packagedCache = Join-Path $appDir.FullName "_internal\data\update_cache.json"
          if (Test-Path $packagedCache) {
            Remove-Item $packagedCache -Force
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "_v$version.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $appDir.FullName "*") -DestinationPath $zipPath -CompressionLevel Optimal

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipPath = "${{ steps.package.outputs.zip_path }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "release_notes.txt"
          $title = "v$version 업무지원도구"

          @"
          v$version 업무지원도구

          Automated release package.
          "@ | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zipPath --target ${{ github.sha }} --title $title --notes-file $notesPath
          }
          else {
            gh release edit $tag --target ${{ github.sha }} --title $title --notes-file $notesPath
            gh release upload $tag $zipPath --clobber
          }
